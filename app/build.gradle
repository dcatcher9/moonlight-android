apply plugin: 'com.android.application'

android {
    ndkVersion = "27.3.13750724"

    compileSdk = 37
    compileSdkMinor = 0

    namespace = 'com.limelight'

    defaultConfig {
        minSdk 24
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        versionName "1.0"
        versionCode = 3

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        // AGP 9 disables custom resource values by default; this build uses
        // resValue in buildTypes/productFlavors (e.g. app_label), so enable it.
        resValues = true
    }

    // Model-family assets are already solid XZ streams. Store them directly in the APK so
    // AssetManager does not add a second compression layer before the selected model is extracted.
    androidResources {
        noCompress += ['xz']
    }

    sourceSets {
        main {
            // Prebuilt accelerator libraries must be flavor-scoped. In particular, keeping this
            // shared source set empty prevents experimental QNN/QAIRT payloads from entering both
            // the root and non-root APKs when they are dropped into src/main/jniLibs locally.
            jniLibs.srcDirs = []
        }
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                    // The GPU bridge is intentionally a separate, lazily loaded module so
                    // libLiteRt is not a hard dependency of the always-loaded streaming core.
                    targets "moonlight-core", "client-sbs-gpu"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.limelight.moonlight3d%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fdcatcher9%2Fmoonlight-android%22%2C%22author%22%3A%22Yang%20Qu%22%2C%22name%22%3A%22Moonlight%203D%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroutToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v%28.%2B%29%5C%22%7D%22%7D"

            applicationId "com.limelight"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig = file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
            excludes.add('META-INF/LICENSE.md')
            excludes.add('META-INF/NOTICE.md')
        }
        jniLibs {
            // The optional native LiteRT bridge resolves its accelerator libraries from
            // ApplicationInfo.nativeLibraryDir, which must be a real filesystem directory.
            useLegacyPackaging = true
            // Galaxy XR does not expose the Hexagon NPU to third-party app UIDs. Keep the
            // unsupported Qualcomm experiment out of every shipping APK even if a dependency or
            // local SDK copy supplies these libraries again.
            excludes.add('**/libLiteRt*Qualcomm.so')
            excludes.add('**/libQairt*.so')
            excludes.add('**/libQnn*.so')
            // The arcore-openxr artifact bundles both the arcore and runtime OpenXR native
            // libs, which collide with the ones from runtime-openxr. With all androidx.xr.*
            // pinned to one matched version (see deps below) the duplicates are identical, so
            // picking either resolves the packaging merge without a version mismatch.
            pickFirsts.add('**/libandroidx.xr.*.openxr.so')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".moonlight3ddebug"
            resValue "string", "app_label", "Moonlight 3D"
            resValue "string", "app_label_root", "Moonlight 3D (Root)"
            resValue "string", "app_label_game", "Moonlight 3D (Game)"
            resValue "bool", "default_enable_perf_logging", "true"

            // minifyEnabled is OFF for debug for faster builds.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            //
            // Moonlight 3D honours that request twice over. Upstream Moonlight is
            // com.limelight; Artemis, which this is forked from, moved to com.limelight.noir;
            // this fork moves again rather than publishing under either. Crashes and store
            // listings belong to whoever shipped the build.
            applicationIdSuffix ".moonlight3d"
            resValue "string", "app_label", "Moonlight 3D"
            resValue "string", "app_label_root", "Moonlight 3D (Root)"
            resValue "string", "app_label_game", "Moonlight 3D (Game)"
            resValue "bool", "default_enable_perf_logging", "false"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable = true
            reset()
            // XR-only build: real Android XR devices (e.g. Galaxy XR) are arm64-v8a;
            // x86_64 is kept only so the build can run on the Android XR emulator.
            // 32-bit (armeabi-v7a) and x86 are dropped — no XR target uses them.
            include "arm64-v8a", "x86_64"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    // Android XR (Jetpack XR / SceneCore) — used to display PC-side SBS streams
    // stereoscopically on Galaxy XR via SurfaceEntity StereoMode.SIDE_BY_SIDE.
    // These libraries declare minSdk 23/24, which is satisfied now that the app's
    // minSdk is 24, so no manifest overrideLibrary is needed. XR APIs are still only
    // exercised on actual XR devices (API 34+), gated by runtime device detection.
    // NOTE: these are pre-1.0 (beta) APIs; pin the version and verify symbols against
    // https://developer.android.com/jetpack/androidx/releases/xr-scenecore
    // IMPORTANT: the Jetpack XR modules version INDEPENDENTLY; keep the five below on one
    // matched release (currently 1.0.0-beta02, 2026-08-12).
    // (arcore-openxr/runtime-openxr are pinned explicitly so the arcore.openxr native lib
    // and its Kotlin classes stay on the same build — a mismatch there crashes the
    // JNI ViewCameraState construction.)
    implementation 'androidx.xr.scenecore:scenecore:1.0.0-beta02'
    implementation 'androidx.xr.runtime:runtime:1.0.0-beta02'
    implementation 'androidx.xr.runtime:runtime-openxr:1.0.0-beta02'
    implementation 'androidx.xr.arcore:arcore:1.0.0-beta02'
    implementation 'androidx.xr.arcore:arcore-openxr:1.0.0-beta02'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.23.0'

    // On-device native LiteRT GL smoke test (no Espresso/UI dependency required).
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
