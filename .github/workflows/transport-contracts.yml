name: Transport contracts

on:
  pull_request:
  push:
    branches: [moonlight-noir]

permissions:
  contents: read

jobs:
  packet-size-and-fec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native crypto headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Compile packet negotiation and actual FEC recovery test
        shell: bash
        run: |
          core=app/src/main/jni/moonlight-core/moonlight-common-c
          cc -std=c11 -DLC_DEBUG -DHAS_SOCKLEN_T -D_POSIX_C_SOURCE=200809L \
            -I "$core/src" -I "$core/reedsolomon" -I "$core/enet/include" \
            "$core/tests/VideoPacketSizeTest.c" "$core/src/RtpVideoQueue.c" \
            "$core/reedsolomon/rs.c" "$core/src/VideoDepacketizer.c" \
            "$core/src/PlatformCrypto.c" "$core/src/ByteBuffer.c" \
            "$core/src/LinkedBlockingQueue.c" "$core/src/Platform.c" "$core/src/SdpGenerator.c" \
            -lcrypto -pthread -o "$RUNNER_TEMP/video-packet-size-test"
      - name: Verify legacy negotiation and encrypted HEVC/AV1 recovery at selected loss positions
        run: '"$RUNNER_TEMP/video-packet-size-test"'
      - name: Compile host telemetry control contract test
        shell: bash
        run: |
          core=app/src/main/jni/moonlight-core/moonlight-common-c
          cc -std=c11 -O2 -flto -DLC_DEBUG -DHAS_SOCKLEN_T -D_POSIX_C_SOURCE=200809L \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -I "$core/src" -I "$core/reedsolomon" -I "$core/enet/include" \
            "$core/tests/ControlTelemetryTest.c" "$core/src/ByteBuffer.c" \
            "$core/src/LinkedBlockingQueue.c" "$core/src/Platform.c" \
            -pthread -o "$RUNNER_TEMP/control-telemetry-test"
      - name: Verify telemetry capability, bounds, subscription and latest-state delivery
        run: '"$RUNNER_TEMP/control-telemetry-test"'
      - name: Verify JNI video buffer ownership on a persistent native thread
        shell: bash
        run: |
          bridge=app/src/main/jni/moonlight-core
          cc -std=c11 -O2 -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            -I app/src/test/native/include -I "$bridge/moonlight-common-c/src" \
            -I "$bridge/libopus/include" app/src/test/native/VideoJniReferenceTest.c \
            -pthread -o "$RUNNER_TEMP/video-jni-reference-test"
          "$RUNNER_TEMP/video-jni-reference-test"
